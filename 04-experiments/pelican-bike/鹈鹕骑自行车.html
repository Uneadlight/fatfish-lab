<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:linear-gradient(#7ec8e3 0%,#bfe6f5 52%,#d6efc0 52%,#a7d98d 100%)}
  body{display:flex;align-items:center;justify-content:center}
  svg{width:min(96vw,1000px);height:auto}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob .55s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  .cloud{animation:drift 22s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1300px)}}
  .grass{animation:drift 6s linear infinite}
</style>
</head>
<body>
<svg viewBox="0 0 900 520">
  <!-- 远山 -->
  <path d="M0 300 Q110 235 230 285 T470 275 T700 295 L900 282 L900 350 L0 350 Z"
        fill="#9fd08f" opacity=".6"/>
  <!-- 云 -->
  <g class="cloud" opacity=".85">
    <ellipse cx="140" cy="86" rx="55" ry="24" fill="#fff"/>
    <ellipse cx="182" cy="74" rx="40" ry="21" fill="#fff"/>
    <ellipse cx="103" cy="78" rx="32" ry="18" fill="#fff"/>
    <ellipse cx="760" cy="110" rx="46" ry="20" fill="#fff"/>
    <ellipse cx="795" cy="100" rx="33" ry="17" fill="#fff"/>
  </g>

  <!-- 地面 -->
  <rect y="440" width="900" height="80" fill="#c9a87a"/>
  <rect y="440" width="900" height="6" fill="#b3915f"/>
  <!-- 草 -->
  <g class="grass" stroke="#7fae5e" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M60 452 q-6 -14 2 -22 M70 452 q4 -12 -2 -20"/>
    <path d="M330 456 q-6 -14 2 -22 M340 456 q4 -12 -2 -20"/>
    <path d="M620 450 q-6 -14 2 -22 M630 450 q4 -12 -2 -20"/>
    <path d="M840 454 q-6 -14 2 -22 M850 454 q4 -12 -2 -20"/>
  </g>

  <!-- 影子 -->
  <ellipse cx="450" cy="446" rx="235" ry="15" fill="#000" opacity=".13"/>

  <!-- 后轮 -->
  <circle cx="280" cy="370" r="70" fill="none" stroke="#2f2f2f" stroke-width="10"/>
  <circle cx="280" cy="370" r="63" fill="none" stroke="#555" stroke-width="2"/>
  <g class="spin" style="transform-origin:280px 370px">
    <g stroke="#777" stroke-width="3.5" stroke-linecap="round">
      <line x1="280" y1="370" x2="280" y2="307"/>
      <line x1="280" y1="370" x2="280" y2="433"/>
      <line x1="280" y1="370" x2="217" y2="370"/>
      <line x1="280" y1="370" x2="343" y2="370"/>
      <line x1="280" y1="370" x2="325" y2="325"/>
      <line x1="280" y1="370" x2="235" y2="415"/>
      <line x1="280" y1="370" x2="325" y2="415"/>
      <line x1="280" y1="370" x2="235" y2="325"/>
    </g>
    <rect x="272" y="300" width="16" height="6" rx="3" fill="#e05050"/>
  </g>
  <circle cx="280" cy="370" r="9" fill="#2f2f2f"/>

  <!-- 前轮 -->
  <circle cx="620" cy="370" r="70" fill="none" stroke="#2f2f2f" stroke-width="10"/>
  <circle cx="620" cy="370" r="63" fill="none" stroke="#555" stroke-width="2"/>
  <g class="spin" style="transform-origin:620px 370px">
    <g stroke="#777" stroke-width="3.5" stroke-linecap="round">
      <line x1="620" y1="370" x2="620" y2="307"/>
      <line x1="620" y1="370" x2="620" y2="433"/>
      <line x1="620" y1="370" x2="557" y2="370"/>
      <line x1="620" y1="370" x2="683" y2="370"/>
      <line x1="620" y1="370" x2="665" y2="325"/>
      <line x1="620" y1="370" x2="575" y2="415"/>
      <line x1="620" y1="370" x2="665" y2="415"/>
      <line x1="620" y1="370" x2="575" y2="325"/>
    </g>
    <rect x="612" y="300" width="16" height="6" rx="3" fill="#e05050"/>
  </g>
  <circle cx="620" cy="370" r="9" fill="#2f2f2f"/>

  <!-- 车架 -->
  <g stroke="#e05050" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M280 370 L450 370"/>
    <path d="M450 370 L380 255"/>
    <path d="M280 370 L380 255"/>
    <path d="M450 370 L555 265"/>
    <path d="M380 255 L555 265"/>
    <path d="M555 265 L620 370"/>
  </g>

  <!-- 车把 -->
  <path d="M555 265 L585 235" stroke="#3a3a3a" stroke-width="10" stroke-linecap="round"/>
  <path d="M568 230 Q598 222 620 240" stroke="#3a3a3a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="622" cy="242" r="6" fill="#222"/>

  <!-- 座垫 -->
  <path d="M345 262 Q378 248 412 262 Q402 274 370 274 Z" fill="#2f2f2f"/>

  <!-- 鹈鹕 -->
  <g class="bob">
    <!-- 尾羽 -->
    <path d="M330 222 L285 200 L292 238 Z" fill="#eef3f8" stroke="#c9d3de" stroke-width="3" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="402" cy="200" rx="80" ry="62" fill="#ffffff" stroke="#c9d3de" stroke-width="3"/>
    <!-- 翅膀 -->
    <path d="M430 180 Q505 195 575 238 Q545 262 480 250 Q438 240 415 205 Z"
          fill="#f2f7fb" stroke="#c9d3de" stroke-width="3" stroke-linejoin="round"/>
    <path d="M452 205 Q505 220 550 240" stroke="#d8e2ec" stroke-width="2.5" fill="none"/>
    <!-- 脖子 -->
    <path d="M438 160 Q452 120 466 96 L500 108 Q486 145 468 178 Z"
          fill="#ffffff" stroke="#c9d3de" stroke-width="3"/>
    <!-- 头 -->
    <circle cx="488" cy="90" r="36" fill="#ffffff" stroke="#c9d3de" stroke-width="3"/>
    <!-- 头顶小羽 -->
    <path d="M470 58 Q476 40 492 50" stroke="#e8b34a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 上喙 -->
    <path d="M516 84 L634 96 Q638 106 624 108 L514 100 Z" fill="#f2a83c" stroke="#c98024" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 喉囊 -->
    <path d="M514 100 Q562 150 620 112 Q604 158 548 160 Q516 154 510 112 Z"
          fill="#f8bd54" stroke="#c98024" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="506" cy="78" r="7.5" fill="#1e1e1e"/>
    <circle cx="508.5" cy="75.5" r="2.4" fill="#ffffff"/>
    <!-- 大腿 -->
    <path id="thigh1" d="M398 252 L420 300" stroke="#e8912b" stroke-width="10" stroke-linecap="round"/>
    <path id="thigh2" d="M428 254 L452 296" stroke="#e8912b" stroke-width="10" stroke-linecap="round"/>
    <!-- 小腿 -->
    <line id="shin1" x1="420" y1="300" x2="450" y2="370" stroke="#d9821f" stroke-width="8" stroke-linecap="round"/>
    <line id="shin2" x1="452" y1="296" x2="450" y2="370" stroke="#d9821f" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 曲柄与踏板 -->
  <line id="crankA" x1="450" y1="370" x2="482" y2="370" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
  <line id="crankB" x1="450" y1="370" x2="418" y2="370" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
  <rect id="pedalA" x="473" y="365" width="18" height="9" rx="3" fill="#333"/>
  <rect id="pedalB" x="409" y="365" width="18" height="9" rx="3" fill="#333"/>
  <circle cx="450" cy="370" r="13" fill="#5a5a5a"/>
  <circle cx="450" cy="370" r="6" fill="#8a8a8a"/>

  <!-- 车铃 -->
  <circle cx="612" cy="258" r="7" fill="#f2c94c" stroke="#c9a227" stroke-width="2"/>
</svg>

<script>
(function () {
  var cx = 450, cy = 370, R = 32;
  var thigh1 = document.getElementById('thigh1');
  var thigh2 = document.getElementById('thigh2');
  var shin1 = document.getElementById('shin1');
  var shin2 = document.getElementById('shin2');
  var crankA = document.getElementById('crankA');
  var crankB = document.getElementById('crankB');
  var pedalA = document.getElementById('pedalA');
  var pedalB = document.getElementById('pedalB');

  var L1 = 56, L2 = 86;
  var hip1 = { x: 398, y: 252 };
  var hip2 = { x: 428, y: 254 };

  function ik(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.min(Math.hypot(dx, dy), L1 + L2 - 1);
    d = Math.max(d, Math.abs(L1 - L2) + 1);
    var a = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
    var base = Math.atan2(dy, dx);
    return {
      x: hip.x + L1 * Math.cos(base + a),
      y: hip.y + L1 * Math.sin(base + a)
    };
  }

  function setLine(el, x1, y1, x2, y2) {
    el.setAttribute('x1', x1);
    el.setAttribute('y1', y1);
    el.setAttribute('x2', x2);
    el.setAttribute('y2', y2);
  }

  function setThigh(el, hip, knee) {
    el.setAttribute('d', 'M' + hip.x + ' ' + hip.y + ' L' + knee.x + ' ' + knee.y);
  }

  var manual = false;
  window.__setT = function (t) { manual = true; frame(t); };

  function frame(t) {
    var ang = (t / 1000) * Math.PI * 2;
    var a = { x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang) };
    var b = { x: cx - R * Math.cos(ang), y: cy - R * Math.sin(ang) };

    setLine(crankA, cx, cy, a.x, a.y);
    setLine(crankB, cx, cy, b.x, b.y);
    pedalA.setAttribute('x', a.x - 9);
    pedalA.setAttribute('y', a.y - 4.5);
    pedalB.setAttribute('x', b.x - 9);
    pedalB.setAttribute('y', b.y - 4.5);

    var k1 = ik(hip1, a);
    var k2 = ik(hip2, b);
    setThigh(thigh1, hip1, k1);
    setThigh(thigh2, hip2, k2);
    setLine(shin1, k1.x, k1.y, a.x, a.y - 4);
    setLine(shin2, k2.x, k2.y, b.x, b.y - 4);

    if (!manual) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
